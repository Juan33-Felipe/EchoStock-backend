services:
  postgres:
    image: postgres:16
    container_name: echostock-postgres
    environment:
      POSTGRES_DB: echostock
      POSTGRES_USER: echostock
      POSTGRES_PASSWORD: echostock
    ports:
      - "5432:5432"
    volumes:
      - echostock-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echostock -d echostock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  echostock-pgdata:
