# Perfil por defecto: H2 en archivo bajo ./data, no necesita Docker.
spring:
  datasource:
    url: jdbc:h2:file:./data/echostock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
